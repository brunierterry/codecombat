name: Japanese JavaScript Quest

on:
  push:
    branches:
      - feature/japanese-js-quest-20-missions
      - feature/japanese-js-quest-learning-reinforcement
      - feature/japanese-js-quest-mission-types-first-pack
      - feature/japanese-js-quest-mission-7-reinforcement
    paths:
      - 'app/assets/japanese-js-quest/**'
      - 'scripts/validate-japanese-js-quest.js'
      - 'scripts/validate-japanese-js-quest-runtime.js'
      - 'scripts/validate-japanese-js-quest-loop-rules.js'
      - 'scripts/validate-japanese-js-quest-learning-reinforcement.js'
      - 'scripts/validate-japanese-js-quest-editor-header-and-card-extension.js'
      - 'scripts/validate-japanese-js-quest-mission-pack-v1.js'
      - 'scripts/validate-japanese-js-quest-mission-pack-v2.js'
      - 'scripts/validate-japanese-js-quest-mission-pack-v3.js'
      - 'scripts/validate-japanese-js-quest-mission-pack-v4.js'
      - 'scripts/validate-japanese-js-quest-concept-pedagogy.js'
      - 'scripts/validate-japanese-js-quest-mission-order-responsive-field.js'
      - 'scripts/validate-japanese-js-quest-dragon-polish.js'
      - 'scripts/validate-japanese-js-quest-story-intro.js'
      - 'docs/PRODUCT_RULES.md'
      - 'docs/DEVELOPMENT_RULES.md'
      - '.github/workflows/japanese-js-quest.yml'
  pull_request:
    paths:
      - 'app/assets/japanese-js-quest/**'
      - 'scripts/validate-japanese-js-quest.js'
      - 'scripts/validate-japanese-js-quest-runtime.js'
      - 'scripts/validate-japanese-js-quest-loop-rules.js'
      - 'scripts/validate-japanese-js-quest-learning-reinforcement.js'
      - 'scripts/validate-japanese-js-quest-editor-header-and-card-extension.js'
      - 'scripts/validate-japanese-js-quest-mission-pack-v1.js'
      - 'scripts/validate-japanese-js-quest-mission-pack-v2.js'
      - 'scripts/validate-japanese-js-quest-mission-pack-v3.js'
      - 'scripts/validate-japanese-js-quest-mission-pack-v4.js'
      - 'scripts/validate-japanese-js-quest-concept-pedagogy.js'
      - 'scripts/validate-japanese-js-quest-mission-order-responsive-field.js'
      - 'scripts/validate-japanese-js-quest-dragon-polish.js'
      - 'scripts/validate-japanese-js-quest-story-intro.js'
      - 'docs/PRODUCT_RULES.md'
      - 'docs/DEVELOPMENT_RULES.md'
      - '.github/workflows/japanese-js-quest.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all missions and fields
        run: node scripts/validate-japanese-js-quest.js
      - name: Validate browser runtime paths
        run: node scripts/validate-japanese-js-quest-runtime.js
      - name: Validate loop rules and infinite-loop preparation
        run: node scripts/validate-japanese-js-quest-loop-rules.js
      - name: Validate syntax preview and concept-card quizzes
        run: node scripts/validate-japanese-js-quest-learning-reinforcement.js
      - name: Validate editor header and mission 01 concept additions
        run: node scripts/validate-japanese-js-quest-editor-header-and-card-extension.js
      - name: Validate mission types and first reinforcement pack
        run: node scripts/validate-japanese-js-quest-mission-pack-v1.js
      - name: Validate mission 7 reinforcement pack
        run: node scripts/validate-japanese-js-quest-mission-pack-v2.js
      - name: Validate if reinforcement and conditional dragon boss
        run: node scripts/validate-japanese-js-quest-mission-pack-v3.js
      - name: Validate river reinforcement and wizard progression
        run: node scripts/validate-japanese-js-quest-mission-pack-v4.js
      - name: Validate concept pedagogy and semantic ownership
        run: node scripts/validate-japanese-js-quest-concept-pedagogy.js
      - name: Validate mission ordering and responsive field sizing
        run: node scripts/validate-japanese-js-quest-mission-order-responsive-field.js
      - name: Validate polished dragon encounter
        run: node scripts/validate-japanese-js-quest-dragon-polish.js
      - name: Validate first-launch story introduction
        run: node scripts/validate-japanese-js-quest-story-intro.js
